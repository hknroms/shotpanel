<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>連射パネル設定</title>
<style>
:root{
  --bg:#14161c; --panel:#1d2029; --panel2:#262a35; --line:#353a48;
  --fg:#e8e9ee; --muted:#9097a8; --accent:#ffb627;
  --normal:#4da3ff; --turbo:#ff5a4e; --p2:#3ddc97; --off:#5b6070; --warn:#ff8a3d;
  --body:"Yu Gothic UI","Meiryo UI","Meiryo",system-ui,sans-serif;
  --mono:"Cascadia Mono","Consolas",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);margin:0}
body{font-family:var(--body);font-size:13px;line-height:1.55;padding:14px 14px 64px;user-select:none}
input,select,textarea{user-select:text}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h2{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:0 0 8px}
h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.06em}
.hint{font-size:12px;color:var(--muted);margin:0}
.mono{font-family:var(--mono)}
select,input[type=text]{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:12.5px;max-width:100%}
input[type=text]{min-width:0;flex:1}
.sbtn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.sbtn:hover{border-color:var(--accent)}
.sbtn.pri{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
.sbtn:disabled{opacity:.4;cursor:default}

/* ヘッダー */
.status{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off);flex:none}
.dot.on{background:var(--p2);box-shadow:0 0 8px var(--p2)}
.rom{font-family:var(--mono);color:var(--accent)}
.pill{font-size:11px;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:1px 8px;white-space:nowrap;margin-left:auto}
.pill.on{border-color:var(--p2);color:var(--p2)}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.editbar label{font-size:12px;color:var(--muted)}
.setup{background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.setup h2{margin:0;color:var(--accent)}
.step{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
.step.done .n{background:var(--p2);border-color:var(--p2);color:#111}
.step.cur .n{background:var(--accent);border-color:var(--accent);color:#111}
.step.done .t{color:var(--muted)}
.step .t small{display:block;color:var(--muted);font-size:11.5px}
.notice{background:var(--panel2);border:1px dashed var(--muted);border-radius:8px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

/* コントローラー */
.devs{display:flex;flex-direction:column;gap:10px}
.pad{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.pad[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2);border-bottom-left-radius:0;border-bottom-right-radius:0}
.pad.dis{opacity:.6}
.phead{display:flex;align-items:center;gap:8px}
.phead .nm{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.conn{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:6px;font-weight:400}
.ty{font-size:12px;color:var(--muted)}
.ord{display:flex;gap:4px}
.ord button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;width:28px;height:26px;cursor:pointer}
.ord button:disabled{opacity:.3;cursor:default}
.pctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--muted);text-align:center}
.devbody{background:var(--panel);border:1px solid var(--accent);border-top:0;border-radius:0 0 8px 8px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-top:-10px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel2);color:var(--fg);border:0;border-right:1px solid var(--line);padding:5px 11px;font-size:12.5px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#111;font-weight:700}

/* パネルの絵 */
.board{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.topstrip{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:flex-end;border-bottom:1px dashed var(--line);padding-bottom:8px}
.topstrip .btn{flex-direction:row;gap:5px;padding:2px 4px}
.topstrip .cap{width:30px;height:16px;border-radius:8px}
.deck{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.deck.sr{grid-template-columns:auto 1fr auto}
.startcol{align-self:start;padding-top:2px}
.lever{width:64px;height:64px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.lever b{width:26px;height:26px;border-radius:50%;background:var(--turbo);box-shadow:inset -4px -6px 0 rgba(0,0,0,.25);transition:transform .03s}
.lever small{position:absolute;bottom:-18px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.lever,.dpad{cursor:pointer}
.lever[aria-pressed="true"],.dpad[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:3px;border-radius:50%}
.dpad[aria-pressed="true"]{border-radius:6px}
.lvrow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.lvrow:first-of-type{border-top:0}
.lvrow>b{font-size:18px;text-align:center;line-height:30px}
.lvrow .lvc{display:flex;flex-direction:column;gap:6px;min-width:0}
.rows{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:380px}
.brow{display:grid;gap:4px}
.brow.stag{padding-left:22px}
.btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--fg);cursor:pointer;padding:3px 2px;border-radius:8px;min-width:0}
.btn[aria-pressed="true"]{background:rgba(255,182,39,.14)}
.btn.learn .cap{outline:3px solid var(--accent);outline-offset:3px;animation:pulse .8s infinite alternate}
@keyframes pulse{from{outline-color:var(--accent)}to{outline-color:transparent}}
@media (prefers-reduced-motion:reduce){.btn.learn .cap{animation:none}.lever b{transition:none}}
.cap{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:inset -5px -7px 0 rgba(0,0,0,.25),0 0 0 3px var(--bg);position:relative}
.cap span{color:#111}
.cap.lit{filter:brightness(1.75);box-shadow:inset 0 0 0 2px #fff,0 0 0 3px var(--bg),0 0 14px rgba(255,255,255,.5)}
.cap.two{box-shadow:inset -5px -7px 0 rgba(0,0,0,.25),0 0 0 3px var(--bg),0 0 0 5px var(--p2)}
.cap.two::after{content:attr(data-p);position:absolute;top:-7px;right:-9px;background:var(--p2);color:#111;font-family:var(--mono);font-size:9.5px;padding:0 3px;border-radius:4px}
.cap.unreg{background:transparent;border:1px dashed var(--muted);box-shadow:none}
.ph{font-family:var(--mono);font-size:10.5px;color:var(--accent);min-height:14px;line-height:14px;white-space:nowrap}
.c-normal{background:var(--normal)} .c-turbo{background:var(--turbo)} .c-off{background:var(--off)}
.gpad{position:relative;width:100%;max-width:460px;margin:0 auto;aspect-ratio:4/3;background:var(--bg);border:1px solid var(--line);border-radius:38% 38% 46% 46% / 30% 30% 70% 70%}
.gpad .pos{position:absolute;transform:translate(-50%,-50%)}
.gpad .btn{padding:0;gap:1px}
.gpad .cap{width:30px;height:30px;font-size:12px}
.gpad .pp.sm .cap{width:38px;height:17px;border-radius:9px}
.gpad .pp.touch .cap{width:62px;height:32px;border-radius:8px}
.gpad .ph{font-size:9.5px;min-height:12px;line-height:12px}
.dpad{position:absolute;left:21%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px}
.dpad i{position:absolute;background:var(--panel2);border:1px solid var(--line);border-radius:4px}
.dpad i.lit{background:var(--accent)}
.dpad i.v{left:18px;top:0;width:18px;height:54px}.dpad i.h{top:18px;left:0;height:18px;width:54px}
.dpad i.u{left:18px;top:0;width:18px;height:18px}.dpad i.d{left:18px;top:36px;width:18px;height:18px}.dpad i.l{left:0;top:18px;width:18px;height:18px}.dpad i.r{left:36px;top:18px;width:18px;height:18px}
.dpad small{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.learnbar{background:var(--accent);color:#111;border-radius:8px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-weight:700}
.learnbar .sbtn{background:#111;color:var(--fg);border-color:#111}

.meter{display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.mnum{display:flex;align-items:baseline;gap:6px;min-width:150px}
.mlab{font-size:12px;color:var(--muted)}
.mnum b{font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums;min-width:62px;text-align:right;color:var(--accent)}
.unit{font-size:12px;color:var(--muted)}
.mgauge{position:relative;height:12px;background:var(--panel2);border-radius:6px;margin-bottom:12px}
.mbar{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--normal),var(--accent),var(--turbo));border-radius:6px}
.mpeak{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);left:0;display:none}
.mgauge i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.mgauge i span{position:absolute;top:13px;left:50%;transform:translateX(-50%);font-size:9.5px;font-style:normal;color:var(--muted);font-family:var(--mono)}
.mside{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
@media (max-width:560px){.meter{grid-template-columns:1fr}.mside{flex-direction:row;align-items:center;gap:10px}}
/* 配置パターン */
.bigbtn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:700;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bigbtn:hover,.gbtn:hover{border-color:var(--accent)}
.bigbtn .cur{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500}
.pgroups{display:flex;flex-direction:column;gap:8px}
.pgroup{display:flex;flex-direction:column;gap:8px}
.gbtn{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;text-align:left;cursor:pointer;display:flex;justify-content:space-between}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.preset{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:left;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.preset[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2)}
.code{font-family:var(--mono);font-size:12px;background:var(--accent);color:#111;border-radius:4px;padding:0 5px}
.mini{display:grid;grid-template-columns:repeat(3,26px);gap:5px}
.mini.w4{grid-template-columns:repeat(4,26px)}
.mini i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:10px;font-weight:700;color:#111;letter-spacing:-.04em}

/* 個別設定 */
.editor{background:var(--bg);border:1px solid var(--accent);border-radius:8px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.editor .row>.tgts,.editor .row>.speed{min-width:0;flex:1 1 260px}
.devbody>*{min-width:0}
.editor h3{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>label{font-size:12px;color:var(--muted);width:68px}
.speed{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.sg{display:flex;flex-direction:column;gap:3px}
.sg small{font-size:10.5px;color:var(--muted)}
.sg .opts{display:flex;gap:4px}
.sp{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;cursor:pointer;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sp[aria-pressed="true"]{background:var(--turbo);border-color:var(--turbo);color:#111;font-weight:700}
.speed .opts{display:flex;flex-wrap:wrap;gap:4px}
.speed .sp{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 8px;min-width:46px}
.speed .sp b{font-size:14px}
.pt{font-size:9px;letter-spacing:-1px;color:var(--muted);white-space:nowrap}
.sp[aria-pressed="true"] .pt{color:#111}
.custom{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.custom .sbtn{padding:2px 9px}
.custom b{min-width:18px;text-align:center}
.ptbig{letter-spacing:1px;color:var(--turbo)}
.strip{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.strip .cell{width:22px;height:22px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;font-size:12px;line-height:1;padding:0}
.strip .cell.on{background:var(--turbo);border-color:var(--turbo);color:#111}
.strip .cell.add{border-style:dashed}
.strip .hint{margin-left:6px}
.tgts{display:flex;flex-wrap:wrap;gap:4px}
.tgts button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.tgts button b{font-size:12.5px;font-weight:500}
.tgts button span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.tgts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#111}
.tgts button[aria-pressed="true"] span{color:#111}
.tgts button.unused{opacity:.45}
.tgts button.unused b::after{content:"（未使用）";font-size:10px}
.swaprow select{flex:1;min-width:0}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:4px 0;font-size:13px;align-self:flex-start}
.frames{font-size:11.5px;color:var(--muted);font-family:var(--mono);width:100%}

.fold summary{cursor:pointer;color:var(--muted);font-size:12.5px;padding:3px 0}
.fold[open]>summary{margin-bottom:8px}
.fold.big>summary{font-size:12px;font-weight:700;letter-spacing:.12em}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.switch{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.switch input{width:16px;height:16px;accent-color:var(--accent)}
.alist{display:grid;gap:3px}
.arow{display:grid;grid-template-columns:minmax(80px,1fr) 22px 14px minmax(0,1.2fr) minmax(0,1.2fr);gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;color:var(--fg);text-align:left;cursor:pointer;font-size:12.5px}
.arow[aria-pressed="true"]{border-color:var(--accent)}
.arow .an{font-family:var(--mono);color:var(--accent);font-size:12px}
.arow .as{color:var(--muted);font-weight:700}
.arow .sw{width:12px;height:12px;border-radius:50%}
.arow .ak{font-family:var(--mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.inis{display:flex;flex-direction:column;gap:6px}
.ini{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.ini .p{font-family:var(--mono);font-size:11.5px;flex:1 1 100%;overflow-wrap:anywhere}
.ok{color:var(--p2)} .ng{color:var(--warn)}
.keys{display:grid;grid-template-columns:auto minmax(170px,1fr) minmax(170px,1fr);gap:4px 12px;align-items:center;min-width:430px}
.kc{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;font-size:11.5px}
.keys b{font-size:12px;color:var(--muted);font-weight:500}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 14px;display:flex;gap:10px;align-items:center}
.toast{font-size:12.5px;color:var(--p2);margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.err{color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="status" id="status"></div>
  </div>
  <div id="setup"></div>
  <div>
  </div>
  <div class="editbar" id="editbar"></div>
  <div id="notice"></div>

  <section><h2>つながっているコントローラー</h2><div class="devs" id="pads"></div></section>

  <details class="fold big" id="mameFold"><summary>MAMEUIの設定</summary><div class="box" id="mameBox"></div></details>
  <details class="fold big" id="keyFold"><summary>キーボードの設定</summary><div class="box" id="keyBox"></div></details>
  <details class="fold big" id="optFold"><summary>全体の設定</summary><div class="box" id="optBox"></div></details>
  <button class="linkbtn" id="mashLink">手連射測定</button>
  <section id="mashBox" hidden></section>
</div>
<div class="bar"><span class="toast" id="toast"></span><span class="hint">変更は自動で保存されます</span><button class="sbtn" id="hideBtn">閉じる（常駐を続ける）</button></div>

<script>
"use strict";
/* ---------- 定数 ---------- */
const COMMON="_common";
const SPEEDS={30:"1F押し・1F離し",20:"1F押し・2F離し",15:"2F押し・2F離し",12:"2F押し・3F離し",10:"3F押し・3F離し",8.6:"3F押し・4F離し",7.5:"4F押し・4F離し",5:"6F押し・6F離し",3:"10F押し・10F離し"};
const FRAMES={30:[1,1],20:[1,2],15:[2,2],12:[2,3],10:[3,3],8.6:[3,4],7.5:[4,4],5:[6,6],3:[10,10]};
const TARGETS=["B1","B2","B3","B4","B5","B6","START","COIN"];
const COMBOS=["B1+B2","B3+B4","B1+B3","B2+B4","B1+B2+B3","B4+B5","B4+B5+B6"];
const TNAME={UP:"上",DOWN:"下",LEFT:"左",RIGHT:"右",B1:"ボタン1",B2:"ボタン2",B3:"ボタン3",B4:"ボタン4",B5:"ボタン5",B6:"ボタン6",B7:"ボタン7",B8:"ボタン8",B9:"ボタン9",B10:"ボタン10",START:"スタート",COIN:"コイン"};
const TSHORT={B1:"S1",B2:"S2",B3:"S3",B4:"K4",B5:"K5",B6:"K6",START:"ST",COIN:"CN"};
const tname=t=>t.split("+").map(x=>TNAME[x]||x).join("＋");
function keyFor(pl,t){return t.split("+").map(x=>x.startsWith("SYS:")?((cfg.keys["0"]||{})[x.slice(4)]||"—"):((cfg.keys[pl]||{})[x]||"—")).join("+")}
const tshort=t=>t.split("+").map(x=>TSHORT[x]||x).join("+");
const SPEED_LIST=[30,20,15,12,10,8.6,7.5,5,3];
function patOf(c){if(c.on>0&&c.off>0)return[c.on,c.off];return FRAMES[c.speed]||[2,2]}
function patOfAlt(a){if(a.pon>0&&a.poff>0)return[a.pon,a.poff];return FRAMES[a.speed]||[2,2]}

window.toast=toast;

/* ---------- 設定の取り出し ---------- */
const devCfg=k=>cfg.devices[k];
function curGame(){return cfg.games[editKey]||cfg.games[COMMON]}
function prof(k,create){
  const g=curGame(),d=devCfg(k);
  let p=g.devices&&g.devices[k];
  if(p)return p;
  const base=(editKey!==COMMON&&cfg.games[COMMON].devices[k])||defaultProf(d.layout);
  if(!create)return base;
  g.devices=g.devices||{};g.devices[k]=clone(base);return g.devices[k];
}
function defaultProf(layout){
  const p={preset:layout==="3b"?"3b3":"6b1",cfg:{},alt:{on:false,axis:"左右",speed:15}};
  (layout==="3b"?SLOTS[3]:SLOTS[6]).forEach((k,i)=>p.cfg[k]={mode:"normal",target:"B"+(i+1),other:false,speed:30});
  p.cfg.start={mode:"normal",target:"START",other:false,speed:30};
  p.cfg.coin={mode:"normal",target:"COIN",other:false,speed:30};
  return p;
}
const bcfg=(k,pos)=>prof(k).cfg[pos]||O();
const DIRS4=[["up","UP","上"],["down","DOWN","下"],["left","LEFT","左"],["right","RIGHT","右"]];
const dcfg=(k,d)=>prof(k).cfg["dir_"+d]||{mode:"normal",target:d.toUpperCase(),other:false,speed:30};
const leverChanged=k=>DIRS4.some(([d,D])=>{const c=dcfg(k,d);return c.mode!=="normal"||c.target!==D||c.other});
const assignOf=k=>devCfg(k).assign||0;
const plOf=k=>assignOf(k)||1;
const XNAMES={X:"X",Y:"Y",A:"A",B:"B",LB:"LB",RB:"RB",LT:"LT",RT:"RT",BACK:"VIEW",START:"MENU",LS:"LS",RS:"RS",GUIDE:"ガイド"};
function physName(k,pos){
  const dv=devs.find(x=>x.key===k),ctl=(devCfg(k).map||{})[pos];
  if(dv&&dv.kind==="xinput"&&ctl&&XNAMES[ctl])return XNAMES[ctl];
  const d=devCfg(k),t=PHYS[d.layout==="pad"&&d.phys!=="xbox"?"ps":d.phys]||PHYS.ps;
  if(t[pos])return t[pos];
  const m=pos.match(/^x_(?:btn)?(.+)$/);if(m)return /^\d+$/.test(m[1])?"ボタン"+m[1]:m[1];
  return pos;
}
function desc(c,pl){
  if(!c||c.mode==="off")return{t:"なし",k:"—"};
  const o=c.other?3-pl:pl;
  const key=keyFor(o,c.target);
  const [on,off]=patOf(c);
  return{t:(c.other?o+"P ":"")+tname(c.target)+(c.mode==="turbo"?" 連射"+rateOf(on,off):""),k:`${c.target.startsWith("SYS:")?"":o+"P "}${tname(c.target)} → ${key}`};
}
function positions(k){
  const d=devCfg(k),L=LAYOUTS[d.layout]||LAYOUTS["8b"];
  const drawn=d.layout==="pad"?Object.keys(PADPOS):[...L.rows.flat(),"start","coin"];
  const extra=Object.keys(d.map||{}).filter(p=>!drawn.includes(p)).sort();
  if(d.layout!=="pad"){for(const b of ALLB)if(!drawn.includes(b)&&!extra.includes(b)&&d.map[b])extra.unshift(b)}
  return{L,drawn,extra:[...new Set(extra)]};
}
function connected(){
  return devs.filter(d=>cfg.devices[d.key]).sort((a,b)=>devCfg(a.key).order-devCfg(b.key).order);
}

/* ---------- 描画 ---------- */
function seg(id,opts,cur){return `<div class="seg" id="${id}">${opts.map(([v,l])=>`<button data-v="${esc(v)}" aria-pressed="${String(v)===String(cur)}">${esc(l)}</button>`).join("")}</div>`}
/* 連射の押す・離すパターン。cur=[on,off] */
function patPicker(id,cur){
  const [on,off]=cur,n=on+off;
  const cells=[];for(let i=0;i<Math.min(n+1,31);i++)cells.push(i<on?`<button class="cell on" data-cell="${i}" title="ここまでを押す長さにする">■</button>`:i<n?`<button class="cell" data-cell="${i}" title="ここまでを離す長さにする">□</button>`:`<button class="cell add" data-cell="${i}" title="離す長さを1つ増やす">＋</button>`);
  return `<div class="speed" id="${id}">
    <div class="opts">${SPEED_LIST.map(v=>{const [a,b]=FRAMES[v];const sel=a===on&&b===off;
      return `<button class="sp" data-v="${v}" aria-pressed="${sel}"><b>${v}</b><span class="pt">${patStr(a,b)}</span></button>`}).join("")}</div>
    <div class="strip" aria-label="1回分の押す・離す">${cells.join("")}<span class="hint">← 1回分（1マス＝1/60秒）。マスを押して長さを変えられます</span></div>
    <div class="custom"><span>押している長さ</span><button class="sbtn" data-adj="on:-1" aria-label="押している長さを減らす">−</button><b class="mono">${on}</b><button class="sbtn" data-adj="on:1" aria-label="押している長さを増やす">＋</button>
      <span>離している長さ</span><button class="sbtn" data-adj="off:-1" aria-label="離している長さを減らす">−</button><b class="mono">${off}</b><button class="sbtn" data-adj="off:1" aria-label="離している長さを増やす">＋</button><span class="hint">マス</span></div>
    <div class="frames">1秒に ${rateOf(on,off)} 回（${on}マス押して ${off}マス離す、をくり返します）</div></div>`;
}
/* パターンの操作を受け取る。set(on,off,speed) */
function bindPat(id,cur,set){
  const el=document.getElementById(id);if(!el)return;
  el.onclick=e=>{
    const b=e.target.closest("[data-v]");if(b){const v=+b.dataset.v;const [a,o]=FRAMES[v];set(a,o,v,false);return}
    const cl=e.target.closest("[data-cell]");if(cl){let [on,off]=cur;const i=+cl.dataset.cell;
      if(i<on){on=Math.max(1,i+1)}else if(i<on+off){off=Math.max(1,i-on+1)}else{off=Math.min(30,off+1)}
      if(i===0&&cur[0]===1){/* 1マスは減らせない */}
      set(on,off,rateOf(on,off),true);return}
    const j=e.target.closest("[data-adj]");if(j){let [on,off]=cur;const [f,dv]=j.dataset.adj.split(":");
      if(f==="on")on=Math.max(1,Math.min(30,on+ +dv));else off=Math.max(1,Math.min(30,off+ +dv));set(on,off,rateOf(on,off),true)}
  };
}

function renderStatus(){
  const st=$("#status");
  let pill;
  if(paused)pill=`<span class="pill warn">一時停止中</span>`;
  else if(game.rom&&curGameIsDirect())pill=`<span class="pill">このゲームはMAMEが直接読む設定</span>`;
  else if(active)pill=`<span class="pill on">MAMEに送信中${sentKeys.length?"："+esc(sentKeys.join(" ")):""}</span>`;
  else pill=`<span class="pill">${cfg.options.onlyWhenFront?"MAMEが前面にないので待機中":"待機中"}</span>`;
  st.innerHTML=game.rom?`<span class="dot on"></span><span>起動中</span><span class="rom">${esc(game.rom)}</span><span>${esc(game.title)}</span>${pill}`
    :`<span class="dot"></span><span>MAMEのゲームは起動していません</span>${pill}`;
}
function curGameIsDirect(){const g=cfg.games[game.rom];return !!(g&&g.direct)}

function autoEditKey(){return game.rom&&cfg.games[game.rom]?game.rom:COMMON}
function renderEditBar(){
  if(!editManual||!cfg.games[editKey])editKey=autoEditKey();
  const games=Object.keys(cfg.games).filter(k=>k!==COMMON).sort();
  const name=k=>k===COMMON?"共通設定（専用設定の無いゲーム）":`${k}${cfg.games[k].title?"　"+cfg.games[k].title:""}${k===game.rom?"（起動中）":""}`;
  $("#editbar").innerHTML=`<label for="editSel">編集する設定</label>
    <select id="editSel">${[COMMON,...games].map(k=>`<option value="${esc(k)}" ${k===editKey?"selected":""}>${esc(name(k))}</option>`).join("")}</select>
    <select id="copySel"><option value="">ほかの設定を読み込む…</option>${[COMMON,...games].filter(k=>k!==editKey).map(k=>`<option value="${esc(k)}">${esc(name(k))}</option>`).join("")}</select>
    ${editKey!==COMMON?`<button class="sbtn" id="delGame">この設定を削除</button>`:""}`;
  $("#editSel").onchange=e=>{editKey=e.target.value;editManual=editKey!==autoEditKey();ui.sel=null;renderAll()};
  $("#copySel").onchange=e=>{const from=e.target.value;if(!from)return;
    const g=cfg.games[editKey];g.devices=clone(cfg.games[from].devices||{});toast(`「${from===COMMON?"共通設定":from}」の内容を読み込みました`);changed()};
  const del=$("#delGame");if(del)del.onclick=()=>{
    if(del.dataset.confirm!=="1"){del.dataset.confirm="1";del.textContent="もう一度押すと削除";setTimeout(()=>{if(del.isConnected){del.dataset.confirm="";del.textContent="この設定を削除"}},3000);return}
    if(cfg.games[editKey].direct&&cfg.options.mameDir)call("gameDirect",{Dir:cfg.options.mameDir,Rom:editKey,On:false}).catch(()=>{});
    delete cfg.games[editKey];toast(`${editKey} の設定を削除しました`);editManual=false;changed()};

  // 起動中のゲームの専用設定
  let n="";
  if(game.rom&&!cfg.games[game.rom]){
    n=`<div class="notice"><span><span class="rom">${esc(game.rom)}</span> 専用の設定はまだありません。いまは共通設定で動いています。</span><button class="sbtn pri" id="mkGame">${esc(game.rom)} 専用の設定を作る</button></div>`;
  }else if(editKey!==COMMON){
    const g=cfg.games[editKey];
    const gi=editKey===game.rom&&game.info;
    n=`<div class="notice">${gi?`<span class="hint">MAMEの情報：${gi.players||"?"}人用・ボタン${gi.buttons||"?"}個${gi.types&&gi.types.some(t=>!/^joy/.test(t))?"・アナログ操作あり（"+gi.types.join(", ")+"）":""}</span>`:""}</div>`;if(!gi)n="";
  }
  $("#notice").innerHTML=n;
  const mk=$("#mkGame");if(mk)mk.onclick=()=>{cfg.games[game.rom]={title:game.title,devices:clone(cfg.games[COMMON].devices||{}),direct:false};editKey=game.rom;editManual=false;toast(`${game.rom} 専用の設定を作りました（共通設定をコピー）`);changed()};
  const dr=$("#direct");if(dr)dr.onchange=e=>{
    const on=e.target.checked,rom=editKey;
    call("gameDirect",{Dir:cfg.options.mameDir||"",Rom:rom,On:on}).then(p=>{cfg.games[rom].direct=on;toast(on?`${p} に joystick 1 を書きました`:`${rom} の直接読み込みをやめました`);changed()})
      .catch(err=>{e.target.checked=!on;toast(err,true)})};
}

function renderPads(){
  const el=$("#pads");el.innerHTML="";
  const list=connected();
  if(!list.length){el.innerHTML=`<div class="empty">コントローラーがつながっていません。<br>USBでつなぐか、Bluetoothでペアリングすると、ここに自動で出てきます。</div>`;return}
  if(!view||!list.find(d=>d.key===view))view=list[0].key;
  list.forEach((d,i)=>{
    const c=devCfg(d.key);
    const p=document.createElement("div");p.className="pad"+(c.assign?"":" dis");p.tabIndex=0;p.setAttribute("role","button");
    p.setAttribute("aria-pressed",view===d.key);
    p.innerHTML=`<div class="phead"><div class="nm">${esc(d.name)}<span class="conn">${esc(d.conn)}</span>${d.kind==="xinput"?'<span class="conn">XInput</span>':""}</div>
        <div class="ord"><button data-mv="-1" aria-label="上へ" ${i===0?"disabled":""}>↑</button><button data-mv="1" aria-label="下へ" ${i===list.length-1?"disabled":""}>↓</button></div></div>
      <div class="ty">ボタン ${d.nButtons}個を認識</div>
      <div class="pctl">${seg("as-"+i,[[1,"1P"],[2,"2P"],[0,"無効"]],c.assign)}
        <select data-f="layout" aria-label="コンパネの配置">${Object.entries(LAYOUTS).map(([k,v])=>`<option value="${k}" ${k===c.layout?"selected":""}>${v.name}</option>`).join("")}</select>
        ${c.layout==="pad"?"":`<select data-f="phys" aria-label="ボタン表記"><option value="ps" ${c.phys!=="xbox"?"selected":""}>PS系の表記</option><option value="xbox" ${c.phys==="xbox"?"selected":""}>Xbox系の表記</option></select>`}
        <button class="sbtn" data-learn="1">ボタン位置を登録</button></div>`;
    p.onclick=e=>{
      const mv=e.target.closest("[data-mv]");
      if(mv){const j=i+ +mv.dataset.mv,a=devCfg(list[i].key),b=devCfg(list[j].key);[a.order,b.order]=[b.order,a.order];if(a.order===b.order)b.order=a.order+(j>i?1:-1);changed();return}
      const v=e.target.closest("[data-v]");
      if(v){c.assign=+v.dataset.v;view=d.key;toast(`${d.name} を ${c.assign?c.assign+"P":"無効"} にしました`);changed();return}
      if(e.target.closest("[data-learn]")){view=d.key;startLearn(d.key);return}
      if(e.target.tagName!=="SELECT"&&view!==d.key){view=d.key;ui.sel=null;ui.learn=null;renderAll()}
    };
    p.onkeydown=e=>{if(e.key==="Enter"&&e.target===p){view=d.key;ui.sel=null;renderAll()}};
    p.querySelectorAll("select[data-f]").forEach(s=>s.onchange=e=>{c[s.dataset.f]=e.target.value;view=d.key;ui.sel=null;changed()});
    el.appendChild(p);
    if(view===d.key){const b=document.createElement("div");b.className="devbody";b.id="devBody";el.appendChild(b);renderBody(d)}
  });
}

function capHTML(k,pos,label,cls){
  const d=devCfg(k),pl=plOf(k),c=bcfg(k,pos),reg=!!(d.map||{})[pos];
  const two=c.mode!=="off"&&c.other;
  const learn=ui.learn&&ui.learn.dev===k&&ui.learn.list[ui.learn.i]===pos;
  return `<button class="btn ${cls||""} ${learn?"learn":""}" data-pos="${pos}" aria-pressed="${ui.sel===pos}" title="${esc(physName(k,pos)+"："+desc(c,pl).t)}"><span class="ph">${esc(physName(k,pos))}</span><div class="cap ${reg?"c-"+c.mode:"unreg"} ${two?"two":""}" ${two?`data-p="${3-pl}P"`:""} data-cap="${pos}"><span>${esc(label)}</span></div></button>`;
}
function slotLabel(k,pos){const n=LAYOUTS[devCfg(k).layout].n,s=SLOTS[n>=8?6:n]||SLOTS[6];const i=s.indexOf(pos);return i>=0?SLOTNAME[i]:""}

function renderBody(d){
  const k=d.key,c=devCfg(k),pl=plOf(k),{L,drawn,extra}=positions(k),p=prof(k),alt=p.alt||{on:false,axis:"左右",speed:15};
  let art;
  if(c.layout==="pad"){
    art=`<div class="gpad"><div class="dpad" id="dpad" data-pos="lever" role="button" tabindex="0" aria-label="十字キーの設定" aria-pressed="${ui.sel==="lever"}"><i class="v"></i><i class="h"></i><i class="u" data-dir="up"></i><i class="d" data-dir="down"></i><i class="l" data-dir="left"></i><i class="r" data-dir="right"></i><small>${alt.on?"交互連打（"+alt.axis+"）":leverChanged(k)?"十字キー（変更あり）":"十字キー"}</small></div>
      ${drawn.filter(pos=>pos.startsWith("b")||c.map[pos]).map(pos=>{const [x,y]=PADPOS[pos];

/* ---------- 手連射の計測 ---------- */
const DIRS=["up","down","left","right"];
const mash={dev:null,hist:[],disp:0,peak:0,last:0,top:"",sel:{}};
try{Object.assign(mash.sel,JSON.parse(localStorage.getItem("mashSel")||"{}"))}catch(e){}
function mashCtl(){const p=mash.sel[mash.dev];if(!p||!cfg.devices[mash.dev])return null;return (cfg.devices[mash.dev].map||{})[p]||null}
function mashSample(d){
  const t=performance.now();
  if(mash.dev!==d.key){mash.dev=d.key;mash.hist=[];mash.disp=0;mash.peak=0;mash.top=""}
  const per=d.presses||{};let total=0;
  const only=mashCtl();
  for(const [k,v] of Object.entries(per))if(!DIRS.includes(k)&&(!only||k===only))total+=v;
  const prev=mash.hist[mash.hist.length-1];
  if(prev&&total>prev.total)mash.last=t;
  mash.hist.push({t,total,per});
  while(mash.hist.length&&t-mash.hist[0].t>2000)mash.hist.shift();
}
function mashRate(){
  const h=mash.hist;if(h.length<2)return 0;
  const now=h[h.length-1],t=performance.now();
  if(t-mash.last>1200)return 0;
  let old=h[0];for(const x of h){if(now.t-x.t<=1000){old=x;break}}
  const dt=(now.t-old.t)/1000;if(dt<0.25)return 0;
  // いちばん連打されているボタン
  let best="",bn=0;const only=mashCtl();for(const [k,v] of Object.entries(now.per)){if(DIRS.includes(k)||(only&&k!==only))continue;const n=v-((old.per||{})[k]||0);if(n>bn){bn=n;best=k}}
  mash.top=best;
  const r=(now.total-old.total)/dt;
  if(dt>=0.8&&r>mash.peak)mash.peak=r;
  return r;
}
function mashTick(){
  const v=$("#mVal");if(!v)return;
  const r=mashRate();
  mash.disp+=(r-mash.disp)*0.12;if(r===0&&mash.disp<0.3)mash.disp=0;
  v.textContent=mash.disp>0.05?mash.disp.toFixed(1):"—";
  const bar=$("#mBar");bar.style.width=Math.min(100,mash.disp/30*100)+"%";bar.style.backgroundSize=bar.parentNode.clientWidth+"px 100%";
  const pk=$("#mPeak");pk.style.display=mash.peak>0?"block":"none";pk.style.left=Math.min(100,mash.peak/30*100)+"%";
  $("#mMax").textContent=mash.peak>0?mash.peak.toFixed(1):"—";
  let name="";if(mash.top&&mash.dev&&cfg.devices[mash.dev]){const m=cfg.devices[mash.dev].map||{};const pos=Object.keys(m).find(p=>m[p]===mash.top);name=pos?physName(mash.dev,pos):mash.top}
  $("#mBtn").textContent=mash.disp>0.05&&name?name+" を連打中":(mashCtl()?"選んだボタンを連打してください":"ボタンを連打すると表示します");
}

function lightTick(){
  const d=devs.find(x=>x.key===view);if(!d||!cfg||!cfg.devices[d.key])return;
  const down=new Set(d.down||[]),map=devCfg(d.key).map||{},t=performance.now();
  document.querySelectorAll("#board [data-cap]").forEach(el=>{
    const pos=el.dataset.cap,c=bcfg(d.key,pos),on=down.has(map[pos]);
    let lit=on;
    if(on&&c.mode==="turbo"){
      if(!el._t0)el._t0=t;const [a,b]=patOf(c);lit=Math.floor((t-el._t0)/(1000/60))%(a+b)<a;
    }else el._t0=0;
    el.classList.toggle("lit",lit);
  });

function mameState(){

function mameReasons(){

    cfg.games=cfg.games||{};cfg.games[COMMON]=cfg.games[COMMON]||{devices:{}};
    for(const g of Object.values(cfg.games))g.devices=g.devices||{};
    for(const d of Object.values(cfg.devices||{}))d.map=d.map||{};
    cfg.keys=cfg.keys||{};for(const pl of ["1","2","0"]){cfg.keys[pl]=cfg.keys[pl]||{};for(const f of Object.keys(DEFKEYS[pl]))if(cfg.keys[pl][f]===undefined)cfg.keys[pl][f]=DEFKEYS[pl][f]}
    cfg.options=cfg.options||keep||{onlyWhenFront:true};
  }
  if(!cfg)return;
  if(!ui.mameLoaded){ui.mameLoaded=true;loadMame(undefined,true)}
  const dk=devs.map(d=>d.key).join(",");
  for(const d of devs)learnTick(d);
  if(!$("#mashBox").hidden){const vd=devs.find(x=>x.key===(mash.target||view));if(vd)mashSample(vd)}
  if(romChanged){lastRom=g.rom;if(!editManual)ui.sel=null;editManual=false}
  if(st.active!==ui.lastActive){ui.lastActive=st.active;renderSetup()}
  if(st.config||romChanged||dk!==lastDevKeys){lastDevKeys=dk;renderAll()}else renderStatus();
};
window.addEventListener("load",()=>call("init").then(r=>{keyNames=r.keyNames||[];autostart=r.autostart}).catch(e=>toast(e,true)));
document.addEventListener("contextmenu",e=>{if(!e.target.closest("input,textarea"))e.preventDefault()});
</script>
</body>
</html>
